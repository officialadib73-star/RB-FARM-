<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RB Group — Agribusiness Simulator</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1218;--p1:#131a22;--p2:#19222c;--bd:#26313d;--tx:#dce4ec;--mu:#8496a8;--ac:#4f9bd6;--g:#4fb386;--w:#dfa63a;--b:#df5f4e;--o:#9a86e0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:12.5px/1.4 'Segoe UI',Inter,system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 440px;grid-template-rows:46px minmax(0,1fr) 62px;height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:26px;padding:0 16px;background:var(--p1);border-bottom:1px solid var(--bd);white-space:nowrap}
.logo{font-weight:700;letter-spacing:.14em;color:#fff}
.kpi{display:flex;flex-direction:column;line-height:1.15}.kpi i{font-style:normal;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}.kpi b{font-size:13.5px;font-weight:600}.kpi b.neg{color:var(--b)}
#view{position:relative;min-height:0;touch-action:none}#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#tip{position:absolute;left:12px;top:12px;background:#0b1016e8;border:1px solid var(--bd);padding:7px 10px;border-radius:6px;pointer-events:none;max-width:300px;display:none}
#hint{position:absolute;right:12px;bottom:8px;color:#ffffffa0;font-size:11px;pointer-events:none;text-shadow:0 1px 2px #000}
#toasts{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;width:370px;pointer-events:none}
.toast{display:flex;gap:8px;align-items:flex-end;animation:in .25s ease;pointer-events:auto}
.av{width:38px;height:38px;border-radius:50%;background:#2a3b4d;flex:none;overflow:hidden;border:2px solid #3b5068}.av svg{width:100%;height:100%;display:block}
.bub{background:#f3f5f7;color:#16202b;border-radius:12px 12px 12px 2px;padding:7px 11px;box-shadow:0 5px 16px #000a;border-left:4px solid var(--ac);font-size:12px}
.bub small{color:#5b6b7b;display:block;font-size:10.5px;margin-bottom:1px}.bub a{color:#1b6fb0;cursor:pointer;font-weight:600;display:inline-block;margin-top:3px}
.toast.good .bub{border-color:var(--g)}.toast.warn .bub{border-color:var(--w)}.toast.bad .bub{border-color:var(--b)}.toast.offer .bub{border-color:var(--o)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#side{background:var(--p1);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--bd);overflow-x:auto;flex:none}
#tabs button{flex:0 0 auto;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--mu);padding:9px 10px;font-size:11px;position:relative;white-space:nowrap}
#tabs button.on{color:#fff;border-color:var(--ac);background:var(--p2)}
.bd{font-style:normal;background:var(--o);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;margin-left:3px}
#pane{flex:1;overflow:auto;padding:10px;min-height:0}
#bot{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:6px 16px;background:var(--p1);border-top:1px solid var(--bd)}
#bot .av{width:42px;height:42px}
#log{flex:1;font-size:11.5px;color:var(--mu);overflow:hidden;height:100%;display:flex;flex-direction:column;justify-content:center}#log div:first-child{color:var(--tx)}#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spd{display:flex;gap:4px}
button{background:#1d2935;color:var(--tx);border:1px solid #34475a;border-radius:4px;padding:5px 11px;cursor:pointer;font:inherit}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(1.18)}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;margin-bottom:7px}.card.sel{border-color:var(--w)}.card.offer{border-left:3px solid var(--o)}
.r{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.sm{color:var(--mu);font-size:11px;margin-bottom:4px}
table{width:100%;border-collapse:collapse}td,th{padding:4px 2px;border-bottom:1px solid var(--bd);text-align:left;font-weight:400}th{color:var(--mu);font-size:10.5px}td:last-child{text-align:right}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:7px 0}.stats>div{background:var(--p1);border:1px solid var(--bd);border-radius:4px;padding:6px 7px;min-width:0}.stats span{display:block;color:var(--mu);font-size:10px;margin-bottom:3px}.stats b{display:block;font-size:13px;overflow-wrap:anywhere}.pos{color:var(--g)}.neg{color:var(--b)}h4{margin:10px 0 4px;color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}label{display:block;margin:5px 0}
.msg{border-left:3px solid var(--ac);background:var(--p2);padding:5px 8px;margin-bottom:6px;border-radius:0 4px 4px 0}.msg.good{border-color:var(--g)}.msg.warn{border-color:var(--w)}.msg.bad{border-color:var(--b)}.msg.offer{border-color:var(--o)}

#socialTicker{display:none!important}
.social-bubble{display:flex;align-items:center;gap:5px;background:#111a;border:1px solid #ffffff20;color:#e9edf2;border-radius:12px;padding:4px 7px;margin-bottom:4px;font-size:10px;line-height:1.2;box-shadow:0 2px 8px #0002;backdrop-filter:blur(3px);animation:socialIn .35s ease}
.social-bubble .social-icon{font-size:11px;font-weight:700;width:14px;text-align:center;flex:none}
.social-bubble .social-copy{overflow-wrap:anywhere}
@keyframes socialIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:var(--p1);border:1px solid var(--bd);border-radius:10px;padding:22px 26px;width:640px;max-width:94vw;max-height:88vh;overflow:auto}
#modal h2{margin-bottom:8px;font-weight:600}#modal ol{margin:8px 0 14px 18px}#modal li{margin-bottom:6px}

#camBtns{position:absolute;right:12px;bottom:28px;display:flex;gap:6px;z-index:3}#camBtns button{padding:4px 9px;font-size:11px;background:#0b1016cc}#camBtns .zoom{font-size:15px;min-width:30px;padding:3px 8px}
#chatRoot{display:flex;flex-direction:column;height:100%;min-height:0;gap:6px}
.ct{display:flex;flex-wrap:wrap;gap:4px}.ct button{padding:3px 8px;font-size:11px;border-radius:12px}.ct button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#chatHead{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px solid var(--bd)}
#chatBox{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.cm{max-width:90%;padding:6px 9px;border-radius:10px;font-size:12px;white-space:pre-wrap;word-break:break-word}
.cm.me{align-self:flex-end;background:#2d6aa3;color:#fff;border-bottom-right-radius:2px}
.cm.tm{align-self:flex-start;background:var(--p2);border:1px solid var(--bd);border-bottom-left-radius:2px}.cm b{display:block;font-size:10.5px;margin-bottom:2px}
#chatQ{display:flex;flex-wrap:wrap;gap:4px}#chatQ button{font-size:10.5px;padding:3px 7px;border-radius:10px;color:var(--mu)}
#chatRow{display:flex;gap:6px}#chatRow input{flex:1;background:#0d1218;color:var(--tx);border:1px solid #34475a;border-radius:4px;padding:7px 8px;font:inherit}

/* Responsive/mobile layout + collapsible controls */
#quickBtns{position:absolute;left:10px;top:10px;z-index:12;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
#quickBtns button{background:#0b1016e8;border-color:#607487;padding:7px 10px;font-size:12px;box-shadow:0 2px 8px #0005}
#app.panel-hidden{grid-template-columns:1fr}
#app.panel-hidden #side{display:none}
#app.hud-hidden{grid-template-rows:0 minmax(0,1fr) 0}
#app.hud-hidden #top,#app.hud-hidden #bot{display:none}
#app.hud-hidden #view{grid-row:1/4}
#side{min-width:0}
button{min-height:30px;touch-action:manipulation}
@media(max-width:760px){
 html,body{height:100%;height:100dvh;font-size:13px}
 #app{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) 58px;height:100vh;height:100dvh;width:100%;overflow:hidden}
 #top{grid-column:1;gap:12px;padding:0 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
 #top::-webkit-scrollbar{display:none}
 .logo{font-size:12px;flex:none}
 .kpi{flex:none}.kpi i{font-size:9px}.kpi b{font-size:12px}
 #top button{flex:none;font-size:11px;padding:5px 8px}
 #view{grid-column:1;grid-row:2;min-height:0;width:100%;overflow:hidden}
 #side{position:absolute;z-index:8;left:7px;right:7px;bottom:66px;height:45dvh;max-height:58dvh;min-height:190px;border:1px solid var(--bd);border-radius:9px;box-shadow:0 8px 28px #0009;overflow:hidden}
 #tabs{overflow-x:auto;scrollbar-width:thin}
 #tabs button{padding:10px 9px;font-size:11px;min-height:39px}
 #pane{padding:8px;overscroll-behavior:contain}
 .card{padding:9px;margin-bottom:7px}
 #bot{grid-column:1;grid-row:3;gap:5px;padding:5px 7px;min-width:0;overflow:hidden}
 #bot .av{width:30px;height:30px;flex:none}
 #log{font-size:10px;min-width:0}
 #spd{gap:3px;flex:none;overflow-x:auto;max-width:31vw}
 #spd button{padding:5px 7px;font-size:10px;flex:none}
 #bot>button{font-size:10px;padding:5px 7px;flex:none}
 #camBtns{left:8px;right:8px;bottom:8px;gap:5px;max-width:calc(100% - 16px);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;padding:3px;justify-content:flex-start}
 #camBtns::-webkit-scrollbar{display:none}
 #camBtns button{flex:none;min-height:34px;font-size:11px;padding:6px 9px}
 #camBtns .zoom{font-size:17px;min-width:36px}
 #hint{display:none}
 #toasts{left:8px;bottom:52px;width:min(340px,calc(100% - 16px));max-height:30%;overflow:hidden}
 .toast{max-width:100%}.bub{font-size:11px;padding:6px 8px}
 #modal{padding:10px}
 #modal .box{width:100%;max-width:100%;max-height:90dvh;padding:16px}
 #chatRoot{height:100%}
 #chatQ{max-height:72px;overflow:auto}
 #chatRow input{min-width:0}
 table{font-size:11px}td,th{padding:5px 3px}
}
@media(max-width:390px){
 #top{gap:9px;padding:0 7px}
 #bot .av{display:none}
 #log{max-width:27vw}
 #spd{max-width:35vw}
 #bot>button{padding:5px 5px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style></head><body>
<div id="app">
 <div id="top"><span class="logo">RB GROUP</span>
  <span class="kpi"><i>Date &amp; time</i><b id="hW"></b></span><span class="kpi"><i>Year</i><b id="hY"></b></span>
  <span class="kpi"><i>Cash</i><b id="hC"></b></span><span class="kpi"><i>Loan</i><b id="hL"></b></span><span class="kpi"><i>Net worth</i><b id="hN"></b></span>
  <button style="margin-left:auto" onclick="tab=6;ui()">💬 Team chat</button><button onclick="showHelp()">How to play</button></div>
 <div id="view"><div id="quickBtns"><button id="panelBtn" onclick="togglePanel()">📋 Open panel</button><button id="hudBtn" onclick="toggleHUD()">↕ Minimise HUD</button></div><canvas id="cv"></canvas><div id="tip"></div><div id="toasts"></div><div id="socialTicker" aria-label="Simulated public reviews"></div><div id="hint">Drag: rotate · Right-drag or Shift-drag: pan · Wheel: zoom · Click a zone</div><div id="camBtns"><button onclick="flyTo(0,22,300)">Whole farm</button><button onclick="flyTo(-8,112,130)">Gate &amp; shops</button><button onclick="flyTo(TX,TZ,75)">Guest stay</button><button onclick="flyTo(118,SHOP_Z0+8,105)">Village lounge</button><button onclick="flyTo(162,SHOP_Z0+15,48)">Bottling plant</button><button class="zoom" aria-label="Zoom in" title="Zoom in" onclick="zoomBy(.8)">+</button><button class="zoom" aria-label="Zoom out" title="Zoom out" onclick="zoomBy(1.25)">−</button></div></div>
 <div id="side"><div id="tabs"></div><div id="pane"></div></div>
 <div id="bot"><div class="av" id="mav"></div><div id="log"></div><div id="spd"></div>
  <button onclick="save();note('info','Saved','Game saved.')">Save</button>
  <button onclick="if(confirm('Reset the whole game?')){localStorage.removeItem(KEY);location.reload()}">Reset</button></div>
</div>
<div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== CONFIG — EDIT HERE ===================== */
const ACRE=4046.86,MARK=1.28,KEY='rbgroup_v2';
const GAME_VAT_RATE=.002, SALE_LOAN_RATE=.01;
const CFG={cash:6000000,wage:3500,adminStaff:4,baseUtil:3500,tax:.002,taxEvery:13,loanRate:.12,loanMax:5000000,licFee:1200000,
 // Land (acres). Poultry 0.50 is a PLACEHOLDER so the total is 6.00 — change when you have the real figure.
 manager:'Mr. Karim',acres:{fishery:2.5,agri:1.35,dairy:.65,poultry:.5,feed:.35,util:.2,admin:.2,store:.25}};
const ZN={fishery:'Fishery',agri:'Agriculture',dairy:'Dairy & Livestock',poultry:'Poultry',feed:'Feed & Processing',util:'Utilities & Biogas',admin:'Administration',store:'Warehouse & Storage'};
const COLS=[['fishery'],['agri','dairy'],['poultry','feed','util','admin','store']]; // map layout (west → east)
/* Enterprises: cap = build cost, cyc = production cycle (weeks), seed = cost per cycle, feed = kg/week, staff = heads, run = weekly running cost */
const E={
 fish:{n:'Fish ponds',cap:350000,max:4,cyc:18,seed:90000,feed:49,staff:.5,out:['fish',2600],start:2,run:0},
 crop:{n:'Crop plots (0.2 ac)',cap:60000,max:6,cyc:8,seed:22000,feed:0,staff:.5,out:['veg',1600],start:2,run:0},
 dairy:{n:'Dairy cows',cap:130000,max:20,feed:17.5,staff:.25,start:4,run:600},
 poul:{n:'Layer sheds (500 birds)',cap:250000,max:6,feed:135,staff:.7,start:1,run:4500},
 mill:{n:'Feed-mill lines',cap:800000,max:3,feed:0,staff:2,start:0,run:6000},
 bio:{n:'Biogas digesters',cap:500000,max:3,feed:0,staff:.5,start:0,run:1500},
 store:{n:'Cold/dry stores (20 t)',cap:400000,max:5,feed:0,staff:1,start:0,run:500},
 shop:{n:'Supermarkets',cap:350000,max:3,feed:0,staff:2,start:1,run:1200}};
const P={fish:{n:'Fish',u:'kg',b:175,d:4000,cap:600,sp:.03},veg:{n:'Vegetables',u:'kg',b:45,d:3000,cap:700,sp:.02},milk:{n:'Milk',u:'L',b:75,d:2500,cap:900,sp:.15},egg:{n:'Eggs',u:'pcs',b:11,d:12000,cap:3000,sp:.01},eggTray:{n:'Packaged egg tray (30 eggs)',u:'tray',b:420,d:500,cap:120,sp:.01},frozenFish:{n:'Packed fish',u:'kg pack',b:225,d:500,cap:80,sp:.04}};
const KG={fish:1,veg:1,milk:1.03,egg:.06,eggTray:1.8,frozenFish:1},BASEP={feed:50,raw:34,gas:45};
const ZE={fishery:'fish',agri:'crop',dairy:'dairy',poultry:'poul',feed:'mill',util:'bio',store:'store'},EZ={};for(const z in ZE)EZ[ZE[z]]=z;

/* ===================== MAP LAYOUT (exact acreage → m²) ===================== */
// Modelled on the reference aerial photo: walled compound with watch-towers, one arched gate on the south side,
// a main road running north from the gate, farmland across the north, utilities/dairy/poultry/admin on the west,
// ponds + feed mill + warehouse on the east, and a landscaped gate plaza (parking, guest cottage, palms).
// Every productive zone keeps its EXACT acreage (total 6.00 ac); the gate plaza is extra landscaped space.
const TA=Object.values(CFG.acres).reduce((a,b)=>a+b,0),FW=150,PL=30,Z={};
const BAND=CFG.acres.agri*ACRE/FW,REST=(TA-CFG.acres.agri)*ACRE/FW,FHt=BAND+REST+PL,WN=-FHt/2,WS=FHt/2,ZAB=WN+BAND,ZBOT=ZAB+REST;
const LCOL=['util','dairy','poultry','admin'],RCOL=['fishery','feed','store'];
const WL=LCOL.reduce((s,k)=>s+CFG.acres[k],0)*ACRE/REST,XR=-FW/2+WL;
Z.agri={x:-FW/2,z:WN,w:FW,h:BAND,cx:0,cz:WN+BAND/2};
[[LCOL,-FW/2,WL],[RCOL,XR,FW-WL]].forEach(([col,x0,w])=>{let z0=ZAB;col.forEach(k=>{const h=CFG.acres[k]*ACRE/w;Z[k]={x:x0,z:z0,w,h,cx:x0+w/2,cz:z0+h/2};z0+=h})});
const TX=-58,TZ=ZBOT+13.1,TOURP={x:TX-12,z:TZ-9.5,w:24,h:19,cx:TX,cz:TZ};
// roads, lanes (left-hand traffic), shops, parking lot, vehicle docks
const RD_Z=WS+10,LE=RD_Z-2.2,LW=RD_Z+2.2,NL=XR-1.5,SL=XR+1.5;
const SHOPX=[-50,0,50],SHOP_Z0=WS+37,SHOP_FRONT=SHOP_Z0-9,SWZ=WS+16.4;
const LOTX0=-22,LOTX1=38,LOTZ0=ZBOT+3,LOTZ1=WS-3,LOT_AZ=(LOTZ0+LOTZ1)/2,BAYX=[-12,-4.5,3,10.5,18,25.5,33],ROWZ=[LOTZ0+5.5,LOTZ1-5.5];
const STAT_BAYS=[[0,1],[0,4],[0,6],[1,0],[1,3],[1,5]];
const DOCK={};for(const k in Z)DOCK[k]={s:Z[k].x<XR?-1:1,z:Z[k].cz,bd:9};
DOCK.agri={s:1,z:ZAB,bd:9};DOCK.util.bd=6.5;DOCK.tour={s:-1,z:ZBOT+12,bd:9};

/* ===================== STATE ===================== */
const $=id=>document.getElementById(id),R_=Math.random;
const BDT=n=>(n<0?'-':'')+'৳'+Math.round(Math.abs(n)).toLocaleString('en-IN');
let S,sel=null,tab=0,modal=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));S.lastLocalSave=Date.now()}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.u&&s.inv)return s}catch(e){}return null}

/* ===================== TIME, MANAGER & ENGINE ===================== */
/* At the default 600× setting, one in-game week takes 10 real minutes. */
const TIME={base:1.68,speeds:[0,1,30,150,600,2400],def:4};
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// The simulator calendar starts on Monday, 5 January 2026.
const GAME_START=new Date(Date.UTC(2026,0,5));
function gameDate(offset){const d=new Date(GAME_START);d.setUTCDate(d.getUTCDate()+Math.max(0,Math.floor(offset||0)));return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});}
function gameDayDate(offset){const n=Math.max(0,Math.floor(offset||0));return DAYN[n%7]+' · '+gameDate(n);}
function harvestInfo(k){const e=E[k], units=S.u[k]||[];const growing=units.map((u,i)=>({u,i,days:u.p>=0?Math.max(0,Math.ceil((e.cyc-u.p)*7-1e-7)):null})).filter(x=>x.days!==null).sort((a,b)=>a.days-b.days);return {growing,first:growing.length?growing[0].days:null};}
function harvestSchedule(k){const e=E[k],label=k==='crop'?'Vegetables':'Fish',h=harvestInfo(k),lines=[];if(!S.u[k].length)return '<div class=sm>'+label+': no production units built yet.</div>';S.u[k].forEach((u,i)=>{if(u.p>=0){const days=Math.max(0,Math.ceil((e.cyc-u.p)*7-1e-7));lines.push('<div class=sm><b>'+label+' unit #'+(i+1)+'</b> — expected '+gameDayDate(S.dayDone+days)+' ('+days+' day'+(days===1?'':'s')+' left)</div>')}else lines.push('<div class=sm><b>'+label+' unit #'+(i+1)+'</b> — idle; '+(S.auto?'auto-restock will replant it':'restock it to start the next cycle')+'</div>')});return lines.join('');}

const CL=['Dhaka Fresh Traders','Bengal Cold Chain Ltd','Meghna Agro Exports','Padma Foods Ltd','Jamuna Retail Group','Sylhet Provisions','Karnaphuli Seafood Co.','Surma Energy Partners'];
const AV='<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#2a3b4d"/><circle cx="20" cy="15" r="7" fill="#e0b894"/><path d="M13 12c1-7 13-7 14 0-3-3-11-3-14 0z" fill="#20252b"/><path d="M5 40c0-9 6-14 15-14s15 5 15 14z" fill="#1f3a5a"/><path d="M16 26l4 5 4-5z" fill="#fff"/><path d="M19 28h2l1 8-2 2-2-2z" fill="#b23a3a"/></svg>';
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const BDTshort=n=>{const a=Math.abs(Number(n)||0),v=a>=1e7?(a/1e7).toFixed(a>=1e8?0:1)+'Cr':a>=1e5?(a/1e5).toFixed(a>=1e6?0:1)+'L':a>=1e3?(a/1e3).toFixed(a>=1e4?0:1)+'K':Math.round(a).toString();return (n<0?'-':'')+'৳'+v};
const TIPS=[[1,'Open the Operations tab: ponds and plots show their cycle progress. Auto-restock keeps them running.'],
 [2,'Milk and eggs are produced daily. Spot-market sales need your approval; protect fresh stock with cold storage or sell it promptly.'],
 [4,'Watch the Offers tab. Clients ask to store goods, buy your produce, or buy biogas. Accept only what you can deliver.'],

// Single accounting gateway: every positive revenue posted through rev() gets VAT accrued and, while a loan is outstanding, the automatic 1% principal deduction. This includes shop sales, commissions, farm sales/contracts, rent, café, accommodation, tourism, storage, feed and biogas.
const rev=(l,a)=>{a=Number(a);if(!Number.isFinite(a)||a<=0)return {repayment:0,vat:0};S.cash=(Number(S.cash)||0)+a;S.qrev=(Number(S.qrev)||0)+a;S.monthGross=(Number(S.monthGross)||0)+a;S.dailyGrossSales=(Number(S.dailyGrossSales)||0)+a;S.rep.r[l]=(Number(S.rep.r[l])||0)+a;const levy=a*GAME_VAT_RATE;S.legal=S.legal||{};S.legal.vatAccrued=(S.legal.vatAccrued||0)+levy;S.dailyVatAccrued=(Number(S.dailyVatAccrued)||0)+levy;S.qcost=(Number(S.qcost)||0)+levy;S.rep.c['Simulated VAT accrued (0.2% of all recorded revenue)']=(S.rep.c['Simulated VAT accrued (0.2% of all recorded revenue)']||0)+levy;let repayment=0;if((Number(S.loan)||0)>0){repayment=Math.min(Number(S.loan)||0,a*SALE_LOAN_RATE);if(repayment>0){S.loan=Math.max(0,S.loan-repayment);S.cash-=repayment;S.loanPrincipalRepaidTotal=(Number(S.loanPrincipalRepaidTotal)||0)+repayment;S.rep.c['Automatic loan principal repayment (1% of sale)']=(S.rep.c['Automatic loan principal repayment (1% of sale)']||0)+repayment;S.loanRepayments=S.loanRepayments||[];S.loanRepayments.unshift({day:S.dayDone,week:S.week,label,amount:repayment,gross:a});S.loanRepayments=S.loanRepayments.slice(0,100);}}S._lastRevenueSettlement={label:String(l),gross:a,repayment,vat:levy};return {repayment,vat:levy};};
// Existing sales call this after rev() to display the deduction in receipts. It now reads the result already posted centrally and never deducts twice.
function settleCompletedSale(label,gross){const amount=Math.max(0,Number(gross)||0),last=S._lastRevenueSettlement;if(last&&Math.abs(last.gross-amount)<0.005)return {repayment:last.repayment,vat:last.vat};return {repayment:0,vat:amount*GAME_VAT_RATE};}
const isPrincipalRepaymentLabel=l=>/^Automatic loan principal repayment/i.test(String(l)); const reportCostsTotal=costs=>Object.keys(costs||{}).reduce((n,l)=>n+(isPrincipalRepaymentLabel(l)?0:(Number(costs[l])||0)),0); const cost=(l,a)=>{a=Number(a);if(!Number.isFinite(a)||a<=0)return;S.cash=(Number(S.cash)||0)-a;S.qcost=(Number(S.qcost)||0)+a;S.rep.c[l]=(Number(S.rep.c[l])||0)+a};

/* ---- daily simulation ---- */
function day(){const I=S.inv,f=S.fl;ensureBusinessData();supermarketDay();sellExternalDay();shopTraffic();tourismDay();hospitalityDay();villageDay();energyDay();
 // Farm by-products feed the mill first; no automatic ingredient purchases.
 const use=weekUse()/7,externalAllowance=use*.02;
 if(n_('mill')&&S.feedRawKg>0){const made=Math.min(S.feedRawKg,n_('mill')*2000/7);S.feedRawKg-=made;I.feed+=made;S.feedProducedInternal=(S.feedProducedInternal||0)+made;}
 const availableFeed=Math.min(I.feed,use);I.feed-=availableFeed;
 const genuineShortage=Math.max(0,use-availableFeed),externalFeed=Math.min(genuineShortage,externalAllowance);
 if(externalFeed>0){cost('Permitted external feed purchase (max 2% of daily demand)',externalFeed*S.pr.feed*1.12);S.feedExternalBought=(S.feedExternalBought||0)+externalFeed;}
 const unmet=Math.max(0,genuineShortage-externalFeed);
 if(unmet>0&&cdn('feed-shortage',2))note('warn','Feed shortage — ration not fully supplied','Internal feed stock and the permitted 2% external allowance cover '+fmt(use-unmet)+' of '+fmt(use)+' kg required today. Shortage: '+fmt(unmet)+' kg. Grow/allocate more feed crops or add feed-mill capacity; no extra feed is invented.',0);
 if(S.feedRawKg<1&&n_('mill')&&cdn('raw-shortage',3))note('warn','Farm feed ingredients low','Farm-produced feed raw materials are '+fmt(S.feedRawKg)+' kg. Harvests contribute feed by-products; no outside raw-material charge is applied automatically.',0);
 const oldMilk=I.milk,oldEgg=I.egg;
 I.milk+=n_('dairy')*10*(f.heat?.85:1);I.egg+=n_('poul')*400*(f.dis?.65:1);
 if(oldMilk<1&&I.milk>=1)note('good','Milk available','Fresh milk is ready: '+fmt(I.milk)+' L in stock. Review the Market tab and approve a sale when you are ready.',1);
 if(oldEgg<1&&I.egg>=1)note('good','Eggs available','Eggs are ready: '+fmt(I.egg)+' pcs in stock. Review the Market tab and approve a sale when you are ready.',1);
 // Daily farm-generated manure: about 18 kg per dairy cow and 0.08 kg per layer bird (500 birds per shed). This is internal feedstock, never an automatic purchase.
 S.organicWasteKg+=(n_('dairy')*18+n_('poul')*500*.08);
 if(n_('bio')){const inputKg=Math.min(S.organicWasteKg,n_('bio')*120);S.organicWasteKg-=inputKg;const g=Math.min(n_('bio')*60,inputKg*.35),own=Math.min(g,6);S.bioGasUsed=(S.bioGasUsed||0)+own;S.biogasSavingsWeek=(S.biogasSavingsWeek||0)+own*16;let sur=g-own;
  if(inputKg<n_('bio')*120&&cdn('bio-input-short',3))note('warn','Biogas input shortage','Available farm-produced manure/organic waste limited digester input to '+fmt(inputKg)+' kg today. Output reduced accordingly; no purchased or free waste was added.',0);
  for(const c of S.contracts.filter(c=>c.ty=='gas')){const d=Math.min(sur,c.vol);rev('Biogas contract sales',d*c.price);settleCompletedSale('Biogas contract sales',d*c.price);sur-=d;
   if(d<c.vol){cost('Biogas shortfall penalty',(c.vol-d)*c.price*.25);if(cdn('gas'+c.client,10))note('warn','Biogas shortfall','Output is below the '+c.vol+' m³/day promised to '+c.client+'. Penalties apply — add livestock or digesters.',0)}}
  rev('Biogas sales (spot)',sur*S.pr.gas);settleCompletedSale('Biogas sales (spot)',sur*S.pr.gas)}
 for(const k of['fish','crop'])S.u[k].forEach(u=>{if(u.p>=0){u.p+=1/7;if(u.p>=E[k].cyc){const q=E[k].out[1]*u.y*(.92+R_()*.16);if(k==='crop'){const feedByproduct=q*.45;S.feedRawKg=(S.feedRawKg||0)+feedByproduct;I.veg+=q-feedByproduct;S.organicWasteKg=(S.organicWasteKg||0)+q*.08;}else I.fish+=q;
  note('good','Harvest complete',fmt(k==='crop'?q*.55:q)+' kg of '+(k=='fish'?'fish':'vegetables')+' added to stock.'+(k==='crop'?'; '+fmt(q*.45)+' kg of crop by-product routed to the feed mill.':''),1);u.p=-1;u.y=1}}});
 if(S.auto)restock();
 const sur=I.feed-weekUse()*3;if(n_('mill')&&sur>0){const q=Math.min(sur,n_('mill')*1500/7);rev('Feed sales (external)',q*S.pr.feed*.96);settleCompletedSale('Feed sales (external)',q*S.pr.feed*.96);I.feed-=q}
 // Products remain in inventory until the player approves a market sale. No automatic spot sales.
 const kg=totalKg(),cov=kg?Math.min(1,(3000+Math.max(0,n_('store')*20000-storeKg()))/kg):1;for(const k in P)I[k]*=1-P[k].sp*(1-.8*cov)}

function approveSale(k,priceValue,qtyValue){
 const p=P[k],available=Math.max(0,S.inv[k]-resv(k));
 const price=Number(priceValue),qty=Number(qtyValue);
 if(!Number.isFinite(price)||price<=0)return note('warn','Invalid price','Enter a selling price above zero.',1);
 if(!Number.isFinite(qty)||qty<=0)return note('warn','Invalid quantity','Enter a quantity above zero.',1);
 if(available<1)return note('warn','Out of stock','There is no available '+p.n.toLowerCase()+' to sell.',1);
 if(qty>available+1e-6)return note('warn','Not enough stock','You offered '+fmt(qty)+' but only '+fmt(available)+' '+p.u+' is available.',1);
 const revenue=qty*price;S.inv[k]=Math.max(0,S.inv[k]-qty);rev('Approved market sale — '+p.n,revenue);const settlement=settleCompletedSale(p.n,revenue);visitFor(k,'Market buyer','buying '+fmt(qty)+' '+p.u+' of '+p.n.toLowerCase());
 if(!Array.isArray(S.salesLog))S.salesLog=[];
 S.salesLog.unshift({day:S.dayDone,week:S.week,item:k,qty,price,revenue});if(S.salesLog.length>100)S.salesLog.length=100;
 note('good','Sale approved and recorded',fmt(qty)+' '+p.u+' of '+p.n.toLowerCase()+' sold at '+BDT(price)+'/'+p.u+'. Revenue: '+BDT(revenue)+'. Automatic loan principal: '+BDT(settlement.repayment)+'; simulated VAT accrued at 0.2%: '+BDT(settlement.vat)+'. Loan principal is a financing cash flow, not an operating expense.',1);
 if(S.inv[k]<1)note('warn','Out of stock',p.n+' stock is now zero. The next batch will appear when production makes it available.',1);
 ui();hud();save();
}

function restock(){for(const k of['fish','crop'])S.u[k].forEach(u=>{if(u.p<0){const c=E[k].seed*(k=='crop'&&n_('bio')?.8:1);
 if(S.cash>=c){cost(k=='fish'?'Fish seed & medicine':'Seed & fertiliser',c);u.p=0;u.y=1;if(cdn('vSeed'+k,5))queueVisit({veh:'van',col:0x2f8f3a,to:k=='fish'?'fishery':'agri',text:k=='fish'?'Fingerling & medicine supplier':'Seed & fertiliser supplier',dwell:8})}}})}

function event(){S.fl={};if(R_()>.10)return;let e=Math.floor(R_()*7);if(e===1&&n_('poul')&&R_()<.55){S.legal.healthIncidentsPrevented=(S.legal.healthIncidentsPrevented||0)+1;note('good','Farm doctor prevented a loss','The doctor’s routine flock-health checks caught an early warning. A disease-related production loss was avoided.',5);return}if(e===2&&n_('dairy')&&R_()<.5){S.legal.healthIncidentsPrevented=(S.legal.healthIncidentsPrevented||0)+1;note('good','Farm doctor reduced heat risk','The doctor’s animal-welfare checklist triggered early hydration and shade checks, reducing the risk of a milk-output loss.',5);return}

 else if(e==1&&n_('poul')){S.fl.dis=1;lg('Disease warning in the layer sheds: egg output −20% this week. Check clean water, ventilation and flock behaviour; isolate visibly sick birds and contact a vet if symptoms appear.','bad','Poultry disease')}

 else if(e==4&&S.u.crop.some(u=>u.p>=0)){S.u.crop.forEach(u=>{if(u.p>=0)u.y*=.9});lg('Pest warning: vegetable yield −10% this cycle. Inspect leaves, remove affected plants and use approved control only if needed.','bad','Pests')}
 else if(e==5){for(const k in P)S.inv[k]*=.96;lg('Power outage: 4% of stored goods spoiled. Check backup power and cold-room temperature.','bad','Outage')}
 else if(e==6){S.pr.feed*=1.15;S.pr.raw*=1.15;lg('Feed ingredient prices rose 15%.','warn','Input costs')}}

 if(o.ty=='store')return o.client+' asks to store '+o.tons+' t of '+(o.cold?'cold-chain':'dry')+' goods for '+o.weeks+' weeks at '+BDT(o.rate)+' per tonne per week.';

 return o.client+' requests '+o.vol+' m³/day of biogas at '+BDT(o.price)+'/m³ for '+o.weeks+' weeks.'}

 else if(r<.8){const it=Object.keys(P)[R_()*4|0],q={fish:[300,1500],veg:[200,900],milk:[200,800],egg:[1000,5000]}[it];

 o.client=cl;o.id=S.nid++;o.exp=n+3+(R_()*3|0);S.offers.push(o);note('offer','New client request',offerText(o),2);if(R_()<.5)queueVisit({veh:'car',to:'admin',text:cl+' — visiting about a deal',dwell:7})}
function accept(id){const o=S.offers.find(x=>x.id==id);if(!o)return;const n=S.dayDone;
 if(o.ty=='store'){if(!n_('store')||storeFree()<o.tons)return note('warn','Cannot accept','Free store space is '+storeFree().toFixed(1)+' t; '+o.tons+' t needed. Build a store or reduce stock first.',2);

 else if(o.ty=='buy'){
  const due=o.item==='veg'&&S.inv.veg<o.qty?Math.max(o.due,n+vegHarvestDays()+2):o.due;
